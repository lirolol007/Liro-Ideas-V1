<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liro Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --bg-card: #121214;
    --bg-input: #18181c;
    --border: rgba(255, 255, 255, 0.06);
    --border-hover: rgba(255, 255, 255, 0.15);
    --text-main: #ffffff;
    --text-muted: #8e8e93;
    --text-dim: #48484a;
    
    /* Glow-Farben */
    --glow-red: rgba(255, 69, 58, 0.35);
    --glow-blue: rgba(10, 132, 255, 0.5);
    --glow-gold: rgba(255, 214, 10, 0.4);
    --glow-green: rgba(48, 209, 88, 0.4);
    --glow-purple: rgba(167, 139, 250, 0.3);
    
    --radius-apple: 12px;
    --radius-pill: 999px;
    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Flüssiger Maus-Glow */
  #mouse-glow {
    position: fixed;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(255,255,255,0.025) 0%, rgba(255,255,255,0) 70%);
    top: -200px;
    left: -200px;
    pointer-events: none;
    z-index: 9999;
    transform: translate3d(0,0,0);
    will-change: transform;
  }

  .page { max-width: 800px; margin: 0 auto; padding: 60px 20px 100px; position: relative; z-index: 2; }

  /* Profile Header styled like Linktree */
  .profile-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 40px;
  }

  .avatar-container {
    position: relative;
    margin-bottom: 16px;
  }

  .avatar {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.08);
    object-fit: cover;
    background: #1c1c1e;
  }

  /* Hier ist die fette, vergrößerte Schrift mit feurigem Gaming-Glow */
  .logo-title {
    font-size: 54px;
    font-weight: 800;
    letter-spacing: -0.05em;
    color: var(--text-main);
    margin-bottom: 4px;
    line-height: 1.1;
    filter: drop-shadow(0 0 25px var(--glow-red));
  }

  .logo-sub {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  /* Format Umschalter */
  .tabs-wrapper {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 32px;
  }

  .tab-btn {
    padding: 10px 20px;
    border-radius: var(--radius-apple);
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
  }

  .tab-btn:hover {
    color: var(--text-main);
    border-color: var(--border-hover);
    transform: translateY(-2px);
  }
  .tab-btn.tab-shorts:hover { box-shadow: 0 4px 15px rgba(10, 132, 255, 0.2); }
  .tab-btn.tab-long:hover { box-shadow: 0 4px 15px rgba(255, 69, 58, 0.2); }

  .tab-btn.active {
    background: var(--text-main);
    color: var(--bg);
    border-color: var(--text-main);
    font-weight: 600;
  }

  /* Cleaner Prompt Generator Panel */
  .generator-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-apple);
    padding: 24px;
    margin-bottom: 32px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .clean-input {
    flex: 1;
    min-width: 260px;
    padding: 14px 16px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-apple);
    color: var(--text-main);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: var(--transition);
  }
  .clean-input:focus { border-color: rgba(255, 255, 255, 0.2); }

  /* Prompt Button: Weiss, wird Blau bei Hover, hebt sich an */
  .gen-button {
    padding: 14px 22px;
    background: var(--text-main);
    color: var(--bg);
    border: none;
    border-radius: var(--radius-apple);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
  }

  .gen-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 20px var(--glow-blue);
    background: #ffffff;
  }

  /* Prompt / Import Textfelder */
  .box-container {
    background: var(--bg-input);
    border: 1px dashed var(--border-hover);
    border-radius: var(--radius-apple);
    padding: 16px;
    margin-top: 16px;
    display: none;
  }
  .box-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  
  .clean-textarea {
    width: 100%; height: 70px; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text-muted); font-family: monospace; font-size: 11px; padding: 10px;
    resize: none; margin-bottom: 10px; outline: none;
  }
  .clean-textarea::placeholder { color: var(--text-dim); }
  #import-textarea { color: var(--text-main); }

  .action-btn {
    padding: 8px 14px; border-radius: 8px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: var(--transition);
  }
  .action-btn:hover { transform: translateY(-1px); }

  /* Workflow Navigation */
  .workflow-nav {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius-apple);
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
  }
  .nav-item:hover { color: var(--text-main); transform: translateY(-2px); }
  
  /* Farb-Leuchten aus dem Wunschzettel */
  .nav-all.active { background: rgba(255,255,255,0.04); color: var(--text-main); border-color: var(--border); }
  .nav-fav.active { background: rgba(255, 214, 10, 0.05); color: #ffd60a; border-color: rgba(255, 214, 10, 0.2); }
  .nav-done.active { background: rgba(48, 209, 88, 0.05); color: #30d158; border-color: rgba(48, 209, 88, 0.2); }

  .nav-fav:hover { box-shadow: 0 0 15px var(--glow-gold); border-color: rgba(255, 214, 10, 0.3); }
  .nav-done:hover { box-shadow: 0 0 15px var(--glow-green); border-color: rgba(48, 209, 88, 0.3); }

  .badge { font-size: 11px; background: var(--bg-input); padding: 1px 6px; border-radius: 6px; color: var(--text-muted); margin-left: 4px; }
  .active .badge { background: rgba(255,255,255,0.1); color: inherit; }

  /* Grids & Cards */
  .section-title { font-size: 11px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.08em; margin: 24px 0 12px; text-transform: uppercase; }
  .cards-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 24px; }
  @media(min-width: 600px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }

  .idea-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-apple);
    padding: 20px; display: flex; flex-direction: column; gap: 10px; transition: var(--transition);
  }
  .idea-card:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
  .idea-card.ai-style { border-color: rgba(10, 132, 255, 0.2); background: linear-gradient(to bottom right, var(--bg-card), rgba(10, 132, 255, 0.01)); }
  .idea-card.archive-style { opacity: 0.5; }

  .card-header { display: flex; justify-content: space-between; align-items: center; }
  .card-tags { display: flex; gap: 6px; }
  .card-tag { font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); font-weight: 700; background: rgba(255,255,255,0.05); padding: 2px 7px; border-radius: var(--radius-pill); }
  .card-tag.ai-badge { background: rgba(10, 132, 255, 0.15); color: #0a84ff; }
  
  .card-actions { display: flex; gap: 4px; }
  .icon-action-btn {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: transparent;
    color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition);
  }
  .icon-action-btn:hover { color: var(--text-main); border-color: var(--border-hover); background: rgba(255,255,255,0.03); }
  .icon-action-btn.active-fav { color: #ffd60a; border-color: rgba(255, 214, 10, 0.4); background: rgba(255, 214, 10, 0.08); }
  .icon-action-btn.active-fav:hover { box-shadow: 0 0 10px var(--glow-gold); }

  .card-title { font-size: 14.5px; font-weight: 600; color: var(--text-main); line-height: 1.4; }
  .card-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; flex: 1; }
  .card-footer { font-size: 11px; color: var(--text-dim); padding-top: 8px; border-top: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--text-dim); border: 1px dashed var(--border); border-radius: var(--radius-apple); font-size: 13px; }

  footer { margin-top: 80px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-dim); display: flex; justify-content: space-between; }
  footer a { color: var(--text-dim); text-decoration: none; }
</style>
</head>
<body>

<div id="mouse-glow"></div>

<div class="page">

  <header class="profile-header">
    <div class="avatar-container">
      <img class="avatar" src="Bild LOL oderso.jpg" alt="Liro Avatar">
    </div>
    <h1 class="logo-title">Liro Labs</h1>
    <p class="logo-sub">Content Engine · VRChat &amp; Furry</p>
  </header>

  <div class="tabs-wrapper" id="format-container">
    <button class="tab-btn tab-shorts active" id="btn-fmt-short" onclick="setFormat('short')">Kurzform (Shorts)</button>
    <button class="tab-btn tab-long" id="btn-fmt-long" onclick="setFormat('long')">Langform (YouTube)</button>
  </div>

  <section class="generator-panel" id="generator-widget">
    <div class="input-row">
      <input class="clean-input" id="ai-prompt" placeholder='Stichwort eingeben (z.B. "Horror Welten", "Blackout")...' />
      <button class="gen-button" onclick="generatePrompt()">1. Prompt erstellen</button>
    </div>

    <div class="box-container" id="prompt-box">
      <div class="box-title" style="color: #0a84ff;">Kopiere diesen Text für deinen KI-Chat:</div>
      <textarea class="clean-textarea" id="prompt-textarea" readonly></textarea>
      <button class="action-btn" style="background:#ffffff; color:#000;" onclick="copyPrompt()">Text kopieren</button>
    </div>

    <div class="box-container" id="import-box" style="display: block; border-style: solid;">
      <div class="box-title" style="color: #30d158;">2. Antwort der KI hier einfügen:</div>
      <textarea class="clean-textarea" id="import-textarea" placeholder="Füge das generierte [ ] JSON hier ein..."></textarea>
      <button class="action-btn" style="background:var(--text-main); color:var(--bg);" onclick="importAIContent()">Ideen einlesen</button>
    </div>
  </section>

  <nav class="workflow-nav">
    <button class="nav-item nav-all active" id="nav-all" onclick="setView('all')">Pool</button>
    <button class="nav-item nav-fav" id="nav-fav" onclick="setView('favorites')">⭐ Favoriten <span class="badge" id="badge-fav">0</span></button>
    <button class="nav-item nav-done" id="nav-done" onclick="setView('archive')">✅ Archiv <span class="badge" id="badge-done">0</span></button>
  </nav>

  <div class="section-title" id="ai-title" style="display:none;">Generierte KI-Ideen</div>
  <div class="cards-grid" id="ai-grid" style="display:none;"></div>

  <div class="section-title" id="pool-title">Basis Ideenpool</div>
  <div class="cards-grid" id="main-grid"></div>

  <footer>
    <span>&copy; 2026 Liro Labs</span>
    <a href="https://www.youtube.com/@Liro_LOL" target="_blank">@Liro_LOL</a>
  </footer>

</div>

<script>
// Flüssiger Maus-Glow
const glow = document.getElementById('mouse-glow');
document.addEventListener('mousemove', (e) => {
  window.requestAnimationFrame(() => {
    glow.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
  });
});

// Kuratierter Basis-Pool
const baseShort = [
  { id: 's1', tag:'meme', title:'POV: Jemand fragt ob Furries weird sind', desc:'Reagiere in Character als dein Fursona – absurd, selbstbewusst, witzig.', inspo:'Inspiration: EN VRChat Community' },
  { id: 's2', tag:'challenge', title:'1 Stunde in VRChat ohne Sprechen', desc:'NPC-Challenge: Antworte nur durch Emotes und Gesten in Public Lobbies.', inspo:'Trend: Silent Challenges' },
  { id: 's3', tag:'reaction', title:'Reagiere auf Furry-Stereotypen', desc:'Kommentiere kurze Clips mit viel Humor und Augenzwinkern.', inspo:'Format: React Shorts' }
];
const baseLong = [
  { id: 'l1', tag:'story', title:'Mein Weg ins Fandom: Erste Erfahrungen', desc:'Ein ehrliches Storytime-Video über deine allerersten Schritte und Welten.', inspo:'Inspiration: Journey Videos' },
  { id: 'l2', tag:'meme', title:'Best of VRChat Highlights', desc:'Compilation deiner witzigsten Erlebnisse in öffentlichen Instanzen.', inspo:'Format à la Lolathon' }
];

// App-Status
let currentView = 'all'; 
let currentFormat = 'short';

let aiList = JSON.parse(localStorage.getItem('ll_ai') || '[]');
let favList = JSON.parse(localStorage.getItem('ll_fav') || '[]');
let archList = JSON.parse(localStorage.getItem('ll_arch') || '[]');

function save() {
  localStorage.setItem('ll_ai', JSON.stringify(aiList));
  localStorage.setItem('ll_fav', JSON.stringify(favList));
  localStorage.setItem('ll_arch', JSON.stringify(archList));
  updateBadges();
}

function updateBadges() {
  document.getElementById('badge-fav').textContent = favList.length;
  document.getElementById('badge-done').textContent = archList.length;
}

function setView(view) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('nav-' + (view === 'favorites' ? 'fav' : view === 'archive' ? 'done' : 'all')).classList.add('active');
  
  document.getElementById('format-container').style.display = view === 'all' ? 'flex' : 'none';
  document.getElementById('generator-widget').style.display = view === 'all' ? 'block' : 'none';
  
  render();
}

function setFormat(fmt) {
  currentFormat = fmt;
  document.getElementById('btn-fmt-short').classList.toggle('active', fmt === 'short');
  document.getElementById('btn-fmt-long').classList.toggle('active', fmt === 'long');
  render();
}

// WORKFLOW FUNKTIONEN
function toggleFav(id, origin) {
  let item = findItem(id, origin);
  if(!item) return;

  const isFav = favList.some(f => f.id === id);
  if(isFav) {
    favList = favList.filter(f => f.id !== id);
    if(item.isAi && !aiList.some(a => a.id === id) && currentView !== 'all') {
      aiList.push(item);
    }
  } else {
    if(origin === 'ai') aiList = aiList.filter(a => a.id !== id);
    if(origin === 'arch') archList = archList.filter(a => a.id !== id);
    favList.push(item);
  }
  save();
  render();
}

function archiveItem(id, origin) {
  let item = findItem(id, origin);
  if(!item) return;

  if(origin === 'ai') aiList = aiList.filter(a => a.id !== id);
  if(origin === 'fav') favList = favList.filter(f => f.id !== id);

  if(!archList.some(a => a.id === id)) archList.push(item);
  save();
  render();
}

function deletePermanent(id) {
  archList = archList.filter(a => a.id !== id);
  save();
  render();
}

function findItem(id, origin) {
  if(origin ===
