<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liro – Idea Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --bg2: #141416;
    --bg3: #1c1c20;
    --bg4: #242428;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0eeea;
    --text2: #9b9894;
    --text3: #5e5c5a;
    --accent: #c8f060;
    --accent2: #a8d040;
    --accent-dim: rgba(200,240,96,0.12);
    --accent-dim2: rgba(200,240,96,0.06);
    --ai-color: #60d4f0;
    --ai-dim: rgba(96,212,240,0.1);
    --radius: 14px;
    --radius-sm: 8px;
    --radius-pill: 999px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  .page { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 0 24px 80px; }

  /* Header mit neuem App-Brand-Layout */
  header {
    padding: 48px 0 40px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
  }

  .brand-wrapper {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  /* iOS App Icon Style */
  .app-icon-container {
    position: relative;
    width: 84px;
    height: 84px;
    flex-shrink: 0;
  }

  .app-icon {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 20px; /* iOS-artiger Radius für 84px Box */
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.05);
  }

  /* Kleiner Online-Dot auf dem Icon */
  .app-icon-container::after {
    content: '';
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--bg);
  }

  .logo-group { display: flex; flex-direction: column; gap: 4px; }

  /* Logo-Schriftzug vergrößert */
  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 52px; /* Vergrößert von 42px */
    letter-spacing: -2px;
    color: var(--text);
    line-height: 1;
  }

  .logo-sub {
    font-size: 13px;
    color: var(--text3);
    font-weight: 400;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .social-links { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .social-link {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border2);
    color: var(--text2);
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: all 0.2s;
    background: var(--bg2);
  }

  .social-link:hover {
    border-color: rgba(255,255,255,0.25);
    color: var(--text);
    background: var(--bg3);
  }

  .social-link svg { width: 14px; height: 14px; fill: currentColor; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 28px;
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 4px;
    border-radius: var(--radius);
    width: fit-content;
  }

  .tab-btn {
    padding: 9px 20px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .tab-btn:hover { color: var(--text); background: var(--bg3); }

  .tab-btn.active {
    background: var(--accent);
    color: #0d0d0f;
    font-weight: 700;
  }

  /* AI Bar */
  .ai-bar {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
  }

  .ai-bar::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--ai-color), transparent);
    opacity: 0.4;
  }

  .ai-bar-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .ai-badge-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--ai-color);
    background: var(--ai-dim);
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    border: 1px solid rgba(96,212,240,0.2);
  }

  .ai-bar-title {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .ai-bar-desc { font-size: 12px; color: var(--text3); }

  .ai-input-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .ai-input {
    flex: 1;
    min-width: 200px;
    padding: 10px 16px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  .ai-input::placeholder { color: var(--text3); }
  .ai-input:focus { border-color: rgba(96,212,240,0.4); }

  .ai-gen-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: var(--accent);
    color: #0d0d0f;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }

  .ai-gen-btn:hover { background: var(--accent2); transform: translateY(-1px); }
  .ai-gen-btn:active { transform: translateY(0); }
  .ai-gen-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .ai-gen-btn svg { width: 15px; height: 15px; }

  .ai-status {
    margin-top: 12px;
    font-size: 12px;
    color: var(--text3);
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 20px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .spinner {
    width: 13px; height: 13px;
    border: 1.5px solid var(--border2);
    border-top-color: var(--ai-color);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  /* Filter bar */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .filter-label { font-size: 11px; color: var(--text3); font-weight: 500; letter-spacing: 0.06em; margin-right: 4px; }

  .filter-btn {
    padding: 5px 14px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
  }

  .filter-btn:hover { border-color: var(--border2); color: var(--text); background: var(--bg3); }

  .filter-btn.active {
    background: var(--bg3);
    border-color: var(--border2);
    color: var(--text);
    font-weight: 600;
  }

  .spacer { flex: 1; }

  .shuffle-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
  }

  .shuffle-btn:hover { border-color: var(--border2); color: var(--text); background: var(--bg3); }
  .shuffle-btn svg { width: 13px; height: 13px; }

  /* Section label */
  .section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--text3);
    margin-bottom: 14px;
    margin-top: 8px;
  }

  .section-label-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Cards grid */
  .ideas-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }

  .idea-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    cursor: default;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: fadeIn 0.3s ease forwards;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .idea-card:hover { border-color: var(--border2); background: var(--bg3); transform: translateY(-2px); }

  .idea-card.ai-card { border-color: rgba(96,212,240,0.2); }
  .idea-card.ai-card:hover { border-color: rgba(96,212,240,0.4); }

  .idea-card.is-saved { border-color: rgba(200,240,96,0.3); }
  .idea-card.is-saved:hover { border-color: rgba(200,240,96,0.5); }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .card-tags { display: flex; gap: 5px; flex-wrap: wrap; }

  .tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 2px 9px;
    border-radius: var(--radius-pill);
    text-transform: uppercase;
  }

  .tag-meme { background: rgba(167,139,250,0.15); color: #c4b5fd; }
  .tag-challenge { background: rgba(52,211,153,0.12); color: #6ee7b7; }
  .tag-story { background: rgba(251,191,36,0.12); color: #fcd34d; }
  .tag-collab { background: rgba(244,114,182,0.12); color: #f9a8d4; }
  .tag-reaction { background: rgba(251,146,60,0.12); color: #fdba74; }
  .tag-tutorial { background: rgba(52,211,153,0.1); color: #86efac; }
  .tag-compilation { background: rgba(96,165,250,0.12); color: #93c5fd; }
  .tag-trend { background: rgba(167,139,250,0.12); color: #d8b4fe; }

  .tag-ai { background: rgba(96,212,240,0.12); color: var(--ai-color); }

  .card-save-btn {
    width: 28px; height: 28px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    color: var(--text3);
  }

  .card-save-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim2); }
  .card-save-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .card-save-btn svg { width: 14px; height: 14px; }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    line-height: 1.35;
  }

  .card-desc {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.55;
    flex: 1;
  }

  .card-inspo {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-size: 11px;
    color: var(--text3);
    line-height: 1.4;
    padding-top: 6px;
    border-top: 1px solid var(--border);
  }

  .card-inspo svg { width: 12px; height: 12px; flex-shrink: 0; margin-top: 1px; }

  /* Saved panel */
  .saved-section {
    margin-top: 40px;
    border-top: 1px solid var(--border);
    padding-top: 28px;
  }

  .saved-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .saved-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .saved-count {
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
  }

  .clear-btn {
    font-size: 12px;
    color: var(--text3);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 0;
    font-family: 'DM Sans', sans-serif;
    transition: color 0.2s;
  }

  .clear-btn:hover { color: var(--text2); }

  .saved-list { display: flex; flex-direction: column; gap: 8px; }

  .saved-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: var(--text);
    transition: border-color 0.2s;
  }

  .saved-item:hover { border-color: var(--border2); }

  .saved-item-text { flex: 1; line-height: 1.3; }
  .saved-item-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

  .unsave-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text3);
    padding: 4px;
    display: flex;
    align-items: center;
    border-radius: 5px;
    transition: all 0.2s;
  }

  .unsave-btn:hover { color: var(--text2); background: var(--bg4); }
  .unsave-btn svg { width: 14px; height: 14px; }

  /* Login overlay */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-box {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 420px;
    position: relative;
    overflow: hidden;
  }

  .login-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }

  .login-logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 32px;
    letter-spacing: -1px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .login-sub {
    font-size: 13px;
    color: var(--text3);
    margin-bottom: 32px;
  }

  .login-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--text2);
    margin-bottom: 8px;
    display: block;
  }

  .login-input {
    width: 100%;
    padding: 12px 16px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    margin-bottom: 10px;
    transition: border-color 0.2s;
    font-family: monospace;
    letter-spacing: 0.05em;
  }

  .login-input:focus { border-color: rgba(200,240,96,0.5); }
  .login-input::placeholder { color: var(--text3); font-family: 'DM Sans', sans-serif; letter-spacing: 0; }

  .login-hint {
    font-size: 11px;
    color: var(--text3);
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .login-hint a { color: var(--text2); }

  .login-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #0d0d0f;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }

  .login-btn:hover { background: var(--accent2); }
  .login-btn:active { transform: scale(0.99); }

  .login-error {
    font-size: 12px;
    color: #fdba74;
    margin-top: 10px;
    display: none;
  }

  .login-secure {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 20px;
    font-size: 11px;
    color: var(--text3);
    justify-content: center;
  }

  .login-secure svg { width: 12px; height: 12px; }

  /* Key indicator in header */
  .key-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text3);
    cursor: pointer;
    padding: 5px 10px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    transition: all 0.2s;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
  }

  .key-indicator:hover { border-color: var(--border2); color: var(--text2); }
  .key-indicator svg { width: 1
