<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liro – Idea Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@anthropic-ai/sdk/dist/index.umd.js"></script>
<style>
  :root {
    --bg: #0d0d0f;
    --bg2: #141416;
    --bg3: #1c1c20;
    --bg4: #242428;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0eeea;
    --text2: #9b9894;
    --text3: #5e5c5a;
    --accent: #c8f060;
    --accent2: #a8d040;
    --accent-dim: rgba(200,240,96,0.12);
    --accent-dim2: rgba(200,240,96,0.06);
    --ai-color: #60d4f0;
    --ai-dim: rgba(96,212,240,0.1);
    --radius: 14px;
    --radius-sm: 8px;
    --radius-pill: 999px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  .page { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 0 24px 80px; }

  /* Header */
  header {
    padding: 48px 0 40px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
  }

  .logo-group { display: flex; flex-direction: column; gap: 6px; }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 42px;
    letter-spacing: -1.5px;
    color: var(--text);
    line-height: 1;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    flex-shrink: 0;
  }

  .logo-sub {
    font-size: 13px;
    color: var(--text3);
    font-weight: 400;
    letter-spacing: 0.03em;
  }

  .social-links { display: flex; gap: 10px; flex-wrap: wrap; }

  .social-link {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border2);
    color: var(--text2);
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: all 0.2s;
    background: var(--bg2);
  }

  .social-link:hover {
    border-color: rgba(255,255,255,0.25);
    color: var(--text);
    background: var(--bg3);
  }

  .social-link svg { width: 14px; height: 14px; fill: currentColor; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 28px;
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 4px;
    border-radius: var(--radius);
    width: fit-content;
  }

  .tab-btn {
    padding: 9px 20px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .tab-btn:hover { color: var(--text); background: var(--bg3); }

  .tab-btn.active {
    background: var(--accent);
    color: #0d0d0f;
    font-weight: 700;
  }

  /* AI Bar */
  .ai-bar {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
  }

  .ai-bar::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--ai-color), transparent);
    opacity: 0.4;
  }

  .ai-bar-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .ai-badge-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--ai-color);
    background: var(--ai-dim);
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    border: 1px solid rgba(96,212,240,0.2);
  }

  .ai-bar-title {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .ai-bar-desc { font-size: 12px; color: var(--text3); }

  .ai
